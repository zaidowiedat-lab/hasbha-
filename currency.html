<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="محول العملات - حاسبة مجانية من حاسبها"><title>محول العملات | حاسبها</title><link rel="stylesheet" href="../assets/style.css"></head><body><header><div class="wrap nav"><a class="logo" href="../index.html">حاسبها</a><nav><a href="../index.html">الرئيسية</a><a href="../about.html">عن حاسبها</a></nav></div></header><main class="wrap calc"><div class="ad">مساحة إعلانية جاهزة لاحقًا</div><section class="box"><h1>محول العملات</h1><p>أدخل البيانات ثم اضغط احسب.</p><div class="fields"><div class="field"><label>المبلغ</label><input id="a" type="number"></div><div class="field"><label>سعر الصرف</label><input id="b" type="number"></div><div class="field"><label></label><input id="c" type="number"></div></div><button class="btn" onclick="go()">احسب</button><div id="r" class="result">النتيجة ستظهر هنا.</div></section></main><script>function go(){let a=document.getElementById('a')?.value;let b=document.getElementById('b')?.value||0;let c=document.getElementById('c')?.value||0; b=+b||0;c=+c||0;let r='';r=`الناتج: <b>${(a*b).toFixed(2)}</b>`;;document.getElementById('r').innerHTML=r}</script></body></html>
