<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="حاسبة العمر - حاسبة مجانية من حاسبها"><title>حاسبة العمر | حاسبها</title><link rel="stylesheet" href="../assets/style.css"></head><body><header><div class="wrap nav"><a class="logo" href="../index.html">حاسبها</a><nav><a href="../index.html">الرئيسية</a><a href="../about.html">عن حاسبها</a></nav></div></header><main class="wrap calc"><div class="ad">مساحة إعلانية جاهزة لاحقًا</div><section class="box"><h1>حاسبة العمر</h1><p>أدخل البيانات ثم اضغط احسب.</p><div class="fields"><div class="field"><label>تاريخ الميلاد</label><input id="a" type="date"></div></div><button class="btn" onclick="go()">احسب</button><div id="r" class="result">النتيجة ستظهر هنا.</div></section></main><script>function go(){let a=document.getElementById('a')?.value;let b=document.getElementById('b')?.value||0;let c=document.getElementById('c')?.value||0; b=+b||0;c=+c||0;let r='';let d=new Date(a),n=new Date(),y=n.getFullYear()-d.getFullYear();if(n<d)r='اختر تاريخًا صحيحًا';else{if(new Date(n.getFullYear(),d.getMonth(),d.getDate())>n)y--;r=`العمر: <b>${y} سنة تقريبًا</b>`};document.getElementById('r').innerHTML=r}</script></body></html>
