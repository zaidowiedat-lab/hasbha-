<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="حاسبة القروض والأقساط - حاسبة مجانية من حاسبها"><title>حاسبة القروض والأقساط | حاسبها</title><link rel="stylesheet" href="../assets/style.css"></head><body><header><div class="wrap nav"><a class="logo" href="../index.html">حاسبها</a><nav><a href="../index.html">الرئيسية</a><a href="../about.html">عن حاسبها</a></nav></div></header><main class="wrap calc"><div class="ad">مساحة إعلانية جاهزة لاحقًا</div><section class="box"><h1>حاسبة القروض والأقساط</h1><p>أدخل البيانات ثم اضغط احسب.</p><div class="fields"><div class="field"><label>قيمة القرض</label><input id="a" type="number"></div><div class="field"><label>الفائدة السنوية %</label><input id="b" type="number"></div><div class="field"><label>المدة بالأشهر</label><input id="c" type="number"></div></div><button class="btn" onclick="go()">احسب</button><div id="r" class="result">النتيجة ستظهر هنا.</div></section></main><script>function go(){let a=document.getElementById('a')?.value;let b=document.getElementById('b')?.value||0;let c=document.getElementById('c')?.value||0; b=+b||0;c=+c||0;let r='';let m=b/100/12,p=m?a*m*Math.pow(1+m,c)/(Math.pow(1+m,c)-1):a/c;r=`القسط الشهري: <b>${p.toFixed(2)}</b><br>إجمالي المدفوع: <b>${(p*c).toFixed(2)}</b>`;;document.getElementById('r').innerHTML=r}</script></body></html>
